<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>☆ rps | you won! </title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="https://use.typekit.net/wob6sfi.css" />
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body class="page">
    <div class="container text-center page-content">
      <div class="row justify-content-center">
        <div class="col-10 col-sm-8 col-md-6">
          <header class="title mb-4">rock, paper, scissors!</header>

          <main class="card-custom p-5">
            <p class="sub">
              congratulations, <span id="username">user</span>!
            </p>
            <h1 class="result">you won!</h1>
            <span id="finalScore"></span>
            <button class="play-again" id="playAgainBtn">play again?</button>
          </main>
        </div>
      </div>
    </div>
    <!-- Bootstrap JavaScript Libraries -->
    <script
      src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
      integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
      crossorigin="anonymous"
    ></script>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.min.js"
      integrity="sha384-BBtl+eGJRgqQAUMxJ7pMwbEyER4l1g+O15P+16Ep7Q9Q+zqX6gSbd85u4mG4QzX+"
      crossorigin="anonymous"
    ></script>
    <script src="scripts.js"></script>
  </body>
</html>
